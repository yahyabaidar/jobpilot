{% comment %}
Usage: {% include "jobs/partials/_url_notice.html" with url=url blocked=blocked %}
{% endcomment %}
{% if blocked %}
<div class="mt-2 flex flex-wrap items-center gap-3 rounded-lg border border-amber-200 dark:border-amber-800 bg-amber-50 dark:bg-amber-950 px-4 py-3 text-sm text-amber-800 dark:text-amber-200">
  <p class="flex-1">
    Ce site n'autorise pas l'import automatique. Ouvre l'offre, copie son texte et colle-le
    ci-dessous — je m'occupe du reste.
  </p>
  <a
    href="{{ url }}"
    target="_blank"
    rel="noopener"
    class="shrink-0 rounded-lg bg-amber-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-amber-700 transition"
  >
    Ouvrir l'offre
  </a>
</div>
{% endif %}
