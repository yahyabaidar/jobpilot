{% comment %}
Usage: {% include "jobs/partials/_manual_paste_form.html" with url=url pasted_text=pasted_text error=error %}
{% endcomment %}
<div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 space-y-4">
  <div>
    <label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">
      Lien de l'offre (optionnel)
    </label>
    <input
      type="url"
      name="url"
      form="manual-paste-form"
      placeholder="https://…"
      value="{{ url|default:'' }}"
      hx-post="{% url 'jobs:check_url' %}"
      hx-trigger="blur changed"
      hx-target="#url-notice"
      hx-swap="innerHTML"
      class="block w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/30 focus:outline-none transition"
    >
    <div id="url-notice"></div>
  </div>

  <form id="manual-paste-form" hx-post="{% url 'jobs:manual_create' %}" hx-target="#manual-job-content" hx-swap="innerHTML">
    {% csrf_token %}
    <label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Texte de l'offre</label>
    <textarea
      name="pasted_text"
      rows="10"
      required
      placeholder="Collez ici le texte complet de l'offre…"
      class="block w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/30 focus:outline-none transition"
    >{{ pasted_text|default:"" }}</textarea>
    {% if error %}
    <p class="mt-2 text-sm text-red-600 dark:text-red-400">{{ error }}</p>
    {% endif %}
    <div class="mt-4">
      {% include "partials/_button.html" with label="Analyser l'offre" variant="primary" %}
    </div>
  </form>
</div>
