{% comment %}
Reusable form field: label + widget + help text + errors.
Usage: {% include "partials/_field.html" with field=form.email %}
{% endcomment %}
<div class="mb-4">
  <label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">
    {{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}
  <p class="mt-1.5 text-xs text-slate-500 dark:text-slate-400">{{ field.help_text|safe }}</p>
  {% endif %}
  {% for error in field.errors %}
  <p class="mt-1.5 text-sm text-red-600 dark:text-red-400">{{ error }}</p>
  {% endfor %}
</div>
