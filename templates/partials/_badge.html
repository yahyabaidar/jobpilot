{% comment %}
Reusable badge/pill.
Usage: {% include "partials/_badge.html" with label="Bientôt disponible" variant="slate" %}
Params: label, variant (primary|slate|emerald|amber|red)
{% endcomment %}
<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold
  {% if variant == 'emerald' %}bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300
  {% elif variant == 'amber' %}bg-amber-50 text-amber-700 dark:bg-amber-950 dark:text-amber-300
  {% elif variant == 'red' %}bg-red-50 text-red-700 dark:bg-red-950 dark:text-red-300
  {% elif variant == 'slate' %}bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300
  {% else %}bg-primary-50 text-primary-700 dark:bg-primary-950 dark:text-primary-300{% endif %}">
  {{ label }}
</span>
