{% comment %}
Usage: context remaining_ids (list[int]), total (int), done (int)
{% endcomment %}
<div
  hx-post="{% url 'matching:batch_step' %}"
  hx-trigger="load"
  hx-target="#jobs-results"
  hx-swap="innerHTML"
  hx-vals='{"remaining_ids": "{{ remaining_ids|join:',' }}", "total": "{{ total }}", "done": "{{ done }}"}'
  class="rounded-2xl border border-dashed border-primary-300 dark:border-primary-800 bg-primary-50 dark:bg-primary-950 px-6 py-10 text-center"
>
  <p class="text-sm font-medium text-primary-700 dark:text-primary-300">
    Analyse des offres en cours… {{ done }}/{{ total }}
  </p>
  <div class="mt-3 h-2 w-full overflow-hidden rounded-full bg-primary-100 dark:bg-primary-900">
    <div class="h-full rounded-full bg-primary-600 transition-all" style="width: {% widthratio done total 100 %}%"></div>
  </div>
</div>
