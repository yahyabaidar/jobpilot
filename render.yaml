databases:
  - name: jobpilot-db
    plan: free
    databaseName: jobpilot
    user: jobpilot

services:
  - type: web
    name: jobpilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/
    envVars:
      # --- Django core ---
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false # e.g. jobpilot.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # e.g. https://jobpilot.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "604800"
      - key: LOG_LEVEL
        value: "INFO"

      # --- Database (wired to the jobpilot-db service above) ---
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString

      # --- Media storage: local disk on Render's free plan is EPHEMERAL, wiped on every
      #     deploy/restart. Leave as the default for the demo; see docs/DEPLOIEMENT.md before
      #     relying on uploaded CVs surviving a redeploy. ---
      - key: MEDIA_STORAGE_BACKEND
        value: "django.core.files.storage.FileSystemStorage"

      # --- Gunicorn ---
      - key: GUNICORN_WORKERS
        value: "3"
      - key: GUNICORN_TIMEOUT
        value: "60"

      # --- LLM (Groq or any OpenAI-compatible endpoint) — fill in the Render dashboard ---
      - key: LLM_BASE_URL
        sync: false # e.g. https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false # e.g. openai/gpt-oss-120b

      # --- France Travail (offres d'emploi API) — optional, fill in the Render dashboard ---
      - key: FRANCE_TRAVAIL_CLIENT_ID
        sync: false
      - key: FRANCE_TRAVAIL_CLIENT_SECRET
        sync: false
