name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobpilot
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://jobpilot:jobpilot@localhost:5432/jobpilot
      # Dummy values only — tests never call the real LLM or France Travail API.
      LLM_BASE_URL: https://example.invalid/v1
      LLM_API_KEY: ci-dummy-key
      LLM_MODEL: dummy-model
      FRANCE_TRAVAIL_CLIENT_ID: ""
      FRANCE_TRAVAIL_CLIENT_SECRET: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -t jobpilot:ci .
